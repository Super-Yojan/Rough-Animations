[package]
name = "rough-animations"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Build scenes from JSON (what the browser components feed the engine).
spec = ["dep:serde", "dep:serde_json"]
# The WebAssembly entry point used by the TypeScript package in `web/`.
web = ["spec", "dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
roughr = "0.14"
rough_tiny_skia = "0.14"
palette = "0.7"
tiny-skia = "0.11"
euclid = "0.22.14"
i_overlay = "9.2.0"
ttf-parser = "0.25.1"
usvg = { version = "0.50.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"

# Browser builds: a transitive dependency needs this to get randomness on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
